<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mitiCosturas - Loja</title>

<style>

*{box-sizing:border-box;}

body{
font-family:Arial;
margin:0;
padding:20px;
background:#f9f9f9
}

header{
background:#ffcccb;
padding:20px;
text-align:center;
border-radius:10px;
margin-bottom:20px;
position:relative
}

button{
padding:10px;
border:none;
border-radius:5px;
background:#ff6b6b;
color:#fff;
cursor:pointer
}

button:hover{background:#ff4c4c}

.produto{
background:#fff;
padding:10px;
margin-bottom:10px;
border-radius:10px;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
box-shadow:0 2px 5px rgba(0,0,0,.1)
}

.produto img{
width:60px;
height:60px;
border-radius:5px;
object-fit:cover;
cursor:pointer
}

#carrinhoLateral{
position:fixed;
top:0;
right:-350px;
width:300px;
height:100%;
background:#fff;
box-shadow:-2px 0 10px rgba(0,0,0,.3);
padding:20px;
overflow-y:auto;
transition:.3s;
z-index:1000
}

#abrirCarrinhoBtn{
position:fixed;
top:20px;
right:20px;
border-radius:50%;
z-index:1001
}

#adminBtn{
position:absolute;
top:20px;
left:20px;
display:none
}

</style>
</head>

<body>

<header>
<h1>mitiCosturas 🧵</h1>

<button id="adminBtn" onclick="irAdmin()">Painel Admin</button>
<button onclick="loginAdmin()">Área Administrativa</button>
</header>

<h2>Produtos</h2>
<div id="produtos"></div>

<!-- CARRINHO -->

<div id="carrinhoLateral">

<h2>🛒 Carrinho</h2>

<div id="itensCarrinho"></div>

<p><strong>Total: R$ <span id="totalCarrinho">0.00</span></strong></p>

<button onclick="finalizarCompra()">Finalizar Compra</button>

<button onclick="fecharCarrinho()" style="background:#aaa;margin-top:10px">
Fechar
</button>

</div>

<button id="abrirCarrinhoBtn" onclick="abrirCarrinho()">
🛒 <span id="contadorCarrinho">0</span>
</button>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>

/* FIREBASE */

const firebaseConfig = {
apiKey:"SUA_KEY",
authDomain:"SEU_DOMINIO",
projectId:"SEU_ID"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* CONFIG */

const SENHA_ADMIN="miti1963";

/* DADOS */

let produtos=[];
let carrinho=JSON.parse(localStorage.getItem("mitiCarrinho"))||[];
let adminLogado=sessionStorage.getItem("mitiAdmin")==="true";

/* ADMIN */

function verificarAdmin(){
if(adminLogado)
document.getElementById("adminBtn").style.display="inline-block";
}

function loginAdmin(){

const usuario=prompt("Usuário:");
const senha=prompt("Senha:");

if(usuario==="admin" && senha===SENHA_ADMIN){
sessionStorage.setItem("mitiAdmin","true");
location.reload();
}else alert("Login incorreto");

}

function irAdmin(){
window.location.href="admin.html";
}

/* FIRESTORE REALTIME */

function carregarProdutosOnline(){

db.collection("loja")
.doc("produtos")
.onSnapshot(doc=>{

if(doc.exists){
produtos=doc.data().lista||[];
renderizarProdutos();
}

});

}

/* SALVAR */

async function salvarProdutos(){
await db.collection("loja").doc("produtos").set({
lista:produtos
});
}

/* RENDER PRODUTOS */

function renderizarProdutos(){

const container=document.getElementById("produtos");
container.innerHTML="";

produtos.forEach(p=>{

const card=document.createElement("div");
card.className="produto";

card.innerHTML=`
<div>
<img src="${p.imagem}">
${p.nome} - R$ ${p.preco.toFixed(2)} - Estoque: ${p.estoque}
</div>

<button onclick="adicionarAoCarrinho(${p.id})"
${p.estoque<=0?"disabled":""}>
${p.estoque<=0?"Esgotado":"Adicionar"}
</button>
`;

container.appendChild(card);

});

}

/* CARRINHO */

function salvarCarrinho(){
localStorage.setItem("mitiCarrinho",JSON.stringify(carrinho));
atualizarCarrinho();
}

function adicionarAoCarrinho(id){

const produto=produtos.find(p=>p.id===id);
if(!produto||produto.estoque<=0)return;

const item=carrinho.find(i=>i.id===id);

if(item) item.quantidade++;
else carrinho.push({...produto,quantidade:1});

produto.estoque--;

salvarProdutos();
salvarCarrinho();
renderizarProdutos();

}

function removerDoCarrinho(id){

const index=carrinho.findIndex(i=>i.id===id);
if(index===-1)return;

const produto=produtos.find(p=>p.id===id);
produto.estoque+=carrinho[index].quantidade;

carrinho.splice(index,1);

salvarProdutos();
salvarCarrinho();
renderizarProdutos();

}

function atualizarCarrinho(){

const container=document.getElementById("itensCarrinho");
const totalSpan=document.getElementById("totalCarrinho");

container.innerHTML="";

let total=0;
let quantidade=0;

carrinho.forEach(item=>{

quantidade+=item.quantidade;
total+=item.preco*item.quantidade;

container.innerHTML+=`
<div style="margin-bottom:10px;border-bottom:1px solid #ddd;padding-bottom:5px">
${item.nome} x${item.quantidade}<br>
<button onclick="removerDoCarrinho(${item.id})"
style="background:#999;margin-top:5px">
Remover
</button>
</div>
`;

});

document.getElementById("contadorCarrinho").innerText=quantidade;
totalSpan.innerText=total.toFixed(2);

}

/* COMPRA */

function finalizarCompra(){

if(carrinho.length===0){
alert("Carrinho vazio");
return;
}

let mensagem="🧵 *Pedido - mitiCosturas*\\n\\n";
let total=0;

carrinho.forEach(item=>{
const subtotal=item.preco*item.quantidade;
total+=subtotal;
mensagem+=`• ${item.nome} x${item.quantidade} - R$ ${subtotal.toFixed(2)}\\n`;
});

mensagem+=`\\n💰 Total: R$ ${total.toFixed(2)}`;

window.open(
`https://wa.me/554391795143?text=${encodeURIComponent(mensagem)}`,
"_blank"
);

carrinho=[];
salvarCarrinho();

}

/* UI */

function abrirCarrinho(){
document.getElementById("carrinhoLateral").style.right="0";
}

function fecharCarrinho(){
document.getElementById("carrinhoLateral").style.right="-350px";
}

/* INIT */

window.onload=()=>{
verificarAdmin();
carregarProdutosOnline();
atualizarCarrinho();
};

</script>

</body>
</html>

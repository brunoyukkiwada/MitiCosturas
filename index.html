<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mitiCosturas</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
  background-color: #f9f9f9;
}

header {
  background-color: #ffcccb;
  padding: 20px;
  text-align:center;
}

header img {
  width:120px;
  border-radius:10px;
}

main { padding:20px; }

.produtos {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:20px;
  margin-top:20px;
}

.produto {
  background:#fff;
  border-radius:10px;
  padding:10px;
  width:200px;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.produto img { width:100%; border-radius:10px; }

button {
  margin-top:10px;
  padding:8px 15px;
  border:none;
  border-radius:8px;
  background-color:#ff6b6b;
  color:white;
  cursor:pointer;
}

button:hover { background-color:#ff4c4c; }

input {
  width:100%;
  padding:8px;
  border-radius:5px;
  border:1px solid #ccc;
  margin-bottom:10px;
}

#adminArea {
  background:#fff;
  padding:15px;
  border-radius:10px;
  max-width:400px;
  margin:0 auto 20px;
  display:none;
}

#carrinhoLateral {
  position:fixed;
  top:0;
  right:-350px;
  width:300px;
  height:100%;
  background:#fff;
  box-shadow:-2px 0 10px rgba(0,0,0,0.3);
  padding:20px;
  overflow-y:auto;
  transition:0.3s;
  z-index:1000;
}

#abrirCarrinhoBtn {
  position:fixed;
  top:20px;
  right:20px;
  z-index:1001;
  padding:10px 15px;
  border:none;
  border-radius:50%;
  background:#ff6b6b;
  color:white;
  font-size:18px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="telaLogin" style="position:fixed;inset:0;background:#fff;display:flex;justify-content:center;align-items:center;z-index:5000;">
  <div style="background:#fff;padding:30px;border-radius:10px;box-shadow:0 0 15px rgba(0,0,0,0.2);width:300px;">
    <h2>Login mitiCosturas</h2>
    <input type="text" id="loginUsuario" placeholder="Usuário">
    <input type="password" id="loginSenha" placeholder="Senha">
    <button onclick="fazerLogin()">Entrar</button>
  </div>
</div>

<header>
  <img src="logo.png">
  <h1>mitiCosturas</h1>
</header>

<main>

<!-- AREA ADMIN -->
<div id="adminArea">
  <h2>Adicionar Produto</h2>
  <input type="text" id="nomeProduto" placeholder="Nome do produto">
  <input type="number" id="precoProduto" placeholder="Preço">
  <input type="number" id="estoqueProduto" placeholder="Quantidade em estoque">
  <input type="file" id="imagemProduto" accept="image/*">
  <button onclick="adicionarProduto()">Salvar Produto</button>
</div>

<h2>Produtos</h2>
<div id="produtos" class="produtos"></div>

</main>

<footer style="margin-top:40px;padding:10px;background:#ffcccb;text-align:center;">
© Mitsuko
</footer>

<!-- Carrinho -->
<div id="carrinhoLateral">
  <h2>🛒 Carrinho</h2>
  <div id="itensCarrinhoLateral"></div>
  <p><strong>Total: R$ <span id="totalCarrinhoLateral">0.00</span></strong></p>
  <button onclick="finalizarCompra()">Finalizar Compra</button>
  <button onclick="fecharCarrinho()" style="background:#aaa;margin-top:10px;">Fechar</button>
</div>

<button id="abrirCarrinhoBtn" onclick="abrirCarrinho()">🛒</button>

<script>

let usuarioLogado = null;
const ADMIN_USER = "mitsuko";
const ADMIN_PASS = "12345miti";

let produtos = JSON.parse(localStorage.getItem("mitiProdutos")) || [];
let carrinho = JSON.parse(localStorage.getItem("mitiCarrinho")) || [];

function salvarTudo(){
  localStorage.setItem("mitiProdutos", JSON.stringify(produtos));
  localStorage.setItem("mitiCarrinho", JSON.stringify(carrinho));
}

function fazerLogin(){
  const user = document.getElementById("loginUsuario").value;
  const pass = document.getElementById("loginSenha").value;

  if(user === ADMIN_USER && pass === ADMIN_PASS){
    usuarioLogado = "admin";
    document.getElementById("adminArea").style.display = "block";
  }
  else if(user && pass){
    usuarioLogado = "cliente";
  }
  else{
    alert("Login inválido!");
    return;
  }

  document.getElementById("telaLogin").style.display="none";
  carregarProdutos();
}

function adicionarProduto(){
  if(usuarioLogado !== "admin") return;

  const nome = nomeProduto.value;
  const preco = precoProduto.value;
  const estoque = estoqueProduto.value;
  const arquivo = imagemProduto.files[0];

  if(!nome || !preco || !estoque || !arquivo){
    alert("Preencha todos os campos!");
    return;
  }

  const reader = new FileReader();
  reader.onload = function(e){
    produtos.push({
      id: Date.now(),
      nome,
      preco: parseFloat(preco),
      estoque: parseInt(estoque),
      imagem: e.target.result
    });
    salvarTudo();
    carregarProdutos();
  };
  reader.readAsDataURL(arquivo);
}

function carregarProdutos(){
  const container = document.getElementById("produtos");
  container.innerHTML="";
  produtos.forEach(produto=>{
    const card = document.createElement("div");
    card.className="produto";

    card.innerHTML=`
      <img src="${produto.imagem}">
      <h3>${produto.nome}</h3>
      <p>R$ ${produto.preco.toFixed(2)}</p>
      <p>Estoque: ${produto.estoque}</p>
      <button onclick="adicionarAoCarrinho(${produto.id})" ${produto.estoque<=0?'disabled':''}>
        ${produto.estoque<=0?'Esgotado':'Adicionar ao Carrinho'}
      </button>
    `;
    container.appendChild(card);
  });
}

function adicionarAoCarrinho(id){
  const produto = produtos.find(p=>p.id===id);
  if(!produto || produto.estoque<=0) return;

  const item = carrinho.find(p=>p.id===id);
  if(item) item.quantidade++;
  else carrinho.push({...produto, quantidade:1});

  produto.estoque--;
  salvarTudo();
  carregarProdutos();
  atualizarCarrinhoLateral();
}

function atualizarCarrinhoLateral(){
  const container = document.getElementById("itensCarrinhoLateral");
  const totalEl = document.getElementById("totalCarrinhoLateral");
  container.innerHTML="";
  let total=0;

  carrinho.forEach(item=>{
    total+=item.preco*item.quantidade;
    container.innerHTML+=`${item.nome} x${item.quantidade} - R$ ${(item.preco*item.quantidade).toFixed(2)}<br>`;
  });

  totalEl.innerText=total.toFixed(2);
}

function abrirCarrinho(){
  document.getElementById("carrinhoLateral").style.right="0";
}

function fecharCarrinho(){
  document.getElementById("carrinhoLateral").style.right="-350px";
}

function finalizarCompra(){
  if(carrinho.length===0){
    alert("Carrinho vazio!");
    return;
  }
  carrinho=[];
  salvarTudo();
  atualizarCarrinhoLateral();
  alert("Compra finalizada!");
}

</script>

</body>
</html>

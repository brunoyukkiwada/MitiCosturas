<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mitiCosturas - Loja</title>
<style>
body{font-family:Arial,sans-serif;margin:0;padding:20px;background:#f9f9f9}
header{background:#ffcccb;padding:20px;text-align:center;border-radius:10px;margin-bottom:20px}
header h1{margin:0;color:#333}
button{padding:10px;border:none;border-radius:5px;background:#ff6b6b;color:#fff;cursor:pointer}
button:hover{background:#ff4c4c}
.produto{background:#fff;padding:10px;margin-bottom:10px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;box-shadow:0 2px 5px rgba(0,0,0,.1)}
.produto img{width:60px;height:60px;border-radius:5px;object-fit:cover;margin-right:10px}
#carrinhoLateral{position:fixed;top:0;right:-350px;width:300px;height:100%;background:#fff;box-shadow:-2px 0 10px rgba(0,0,0,.3);padding:20px;overflow-y:auto;transition:.3s}
#abrirCarrinhoBtn{position:fixed;top:20px;right:20px;border-radius:50%}
</style>
</head>
<body>

<header>
<h1>mitiCosturas 🧵</h1>
<a href="admin.html"><button>Painel Admin</button></a>
</header>

<h2>Produtos</h2>
<div id="produtos"></div>

<div id="carrinhoLateral">
<h2>🛒 Carrinho</h2>
<div id="itensCarrinho"></div>
<p><strong>Total: R$ <span id="totalCarrinho">0.00</span></strong></p>
<button onclick="finalizarCompra()">Finalizar Compra</button>
<button onclick="fecharCarrinho()" style="background:#aaa;margin-top:10px">Fechar</button>
</div>

<button id="abrirCarrinhoBtn" onclick="abrirCarrinho()">🛒</button>

<script>
let produtos = JSON.parse(localStorage.getItem("mitiProdutos")) || [];
let carrinho = JSON.parse(localStorage.getItem("mitiCarrinho")) || [];

function salvarCarrinho(){
  localStorage.setItem("mitiCarrinho", JSON.stringify(carrinho));
  atualizarCarrinho();
}

function carregarProdutos(){
  const container = document.getElementById("produtos");
  container.innerHTML="";
  produtos.forEach(p=>{
    let card=document.createElement("div");
    card.className="produto";
    card.innerHTML=`
      <div>
        <img src="${p.imagem}">
        ${p.nome} - R$ ${p.preco.toFixed(2)} - Estoque: ${p.estoque}
      </div>
      <button onclick="adicionarAoCarrinho(${p.id})" ${p.estoque<=0?'disabled':''}>
        ${p.estoque<=0?'Esgotado':'Adicionar'}
      </button>`;
    container.appendChild(card);
  });
}

function adicionarAoCarrinho(id){
  const p=produtos.find(x=>x.id===id);
  if(!p||p.estoque<=0) return;
  const item=carrinho.find(x=>x.id===id);
  if(item)item.quantidade++;
  else carrinho.push({...p,quantidade:1});
  p.estoque--;
  localStorage.setItem("mitiProdutos", JSON.stringify(produtos));
  salvarCarrinho();
  carregarProdutos();
}

function atualizarCarrinho(){
  const c=document.getElementById("itensCarrinho");
  const t=document.getElementById("totalCarrinho");
  c.innerHTML="";
  let total=0;
  carrinho.forEach(item=>{
    total+=item.preco*item.quantidade;
    c.innerHTML+=`${item.nome} x${item.quantidade}<br>`;
  });
  t.innerText=total.toFixed(2);
}

function finalizarCompra(){
  carrinho=[];
  salvarCarrinho();
  alert("Compra finalizada!");
}

function abrirCarrinho(){document.getElementById("carrinhoLateral").style.right="0";}
function fecharCarrinho(){document.getElementById("carrinhoLateral").style.right="-350px";}

window.onload=function(){ carregarProdutos(); atualizarCarrinho(); }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mitiCosturas</title>
<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
  background-color: #f9f9f9;
}
header {
  background-color: #ffcccb;
  padding: 20px;
  text-align:center;
}
header img {
  width:120px;
  border-radius:10px;
}
main { padding:20px; }
.produtos {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:20px;
  margin-top:20px;
}
.produto {
  background:#fff;
  border-radius:10px;
  padding:10px;
  width:200px;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}
.produto img { width:100%; border-radius:10px; }
button {
  margin-top:10px;
  padding:8px 15px;
  border:none;
  border-radius:8px;
  background-color:#ff6b6b;
  color:white;
  cursor:pointer;
}
button:hover { background-color:#ff4c4c; }
input { width:100%; padding:8px; border-radius:5px; border:1px solid #ccc; margin-bottom:10px; }
#carrinhoLateral {
  position:fixed; top:0; right:-350px; width:300px; height:100%;
  background:#fff; box-shadow:-2px 0 10px rgba(0,0,0,0.3);
  padding:20px; overflow-y:auto; transition:0.3s; z-index:1000;
}
#carrinhoLateral h2 { margin-top:0; }
#abrirCarrinhoBtn {
  position:fixed; top:20px; right:20px; z-index:1001;
  padding:10px 15px; border:none; border-radius:50%; background:#ff6b6b; color:white; font-size:18px;
}
</style>
</head>
<body>

<header>
  <img src="logo.png" alt="Logo mitiCosturas">
  <h1>mitiCosturas</h1>
</header>

<main>

<h2>Adicionar Produto</h2>
<div style="background:#fff;padding:15px;border-radius:10px;max-width:400px;margin:0 auto 20px;">
  <input type="text" id="nomeProduto" placeholder="Nome do produto">
  <input type="number" id="precoProduto" placeholder="Preço">
  <input type="number" id="estoqueProduto" placeholder="Quantidade em estoque">
  <input type="file" id="imagemProduto" accept="image/*">
  <button onclick="adicionarProduto()">Salvar Produto</button>
</div>

<h2>Produtos</h2>
<div id="produtos" class="produtos"></div>

<div style="margin-top:40px; text-align:center;">
  <h2>Fale com a mitiCosturas</h2>
  <img src="qr.png" width="200">
  <p><a href="https://wa.me/554391795143" target="_blank">Abrir WhatsApp</a></p>
</div>

</main>

<footer style="margin-top:40px;padding:10px;background:#ffcccb;text-align:center;">
© Mitsuko
</footer>

<!-- Carrinho lateral estilo Shopee -->
<div id="carrinhoLateral">
  <h2>🛒 Carrinho</h2>
  <div id="itensCarrinhoLateral"></div>
  <p><strong>Total: R$ <span id="totalCarrinhoLateral">0.00</span></strong></p>
  <button onclick="finalizarCompra()">Finalizar Compra</button>
  <button onclick="fecharCarrinho()" style="background:#aaa;margin-top:10px;">Fechar</button>
</div>
<button id="abrirCarrinhoBtn" onclick="abrirCarrinho()">🛒</button>

<script>

let usuarioLogado = null;

const ADMIN_USER = "mitsuko";
const ADMIN_PASS = "12345miti"; // ALTERE ESSA SENHA

let produtos = JSON.parse(localStorage.getItem("mitiProdutos")) || [];
let carrinho = JSON.parse(localStorage.getItem("mitiCarrinho")) || [];

function salvarTudo() {
  localStorage.setItem("mitiProdutos", JSON.stringify(produtos));
  localStorage.setItem("mitiCarrinho", JSON.stringify(carrinho));
}

/* ================= LOGIN ================= */

function fazerLogin(){
  const user = document.getElementById("loginUsuario").value;
  const pass = document.getElementById("loginSenha").value;

  if(user === ADMIN_USER && pass === ADMIN_PASS){
    usuarioLogado = "admin";
    localStorage.setItem("mitiSessao","admin");
    iniciarSistema();
  } 
  else if(user && pass){
    usuarioLogado = "cliente";
    localStorage.setItem("mitiSessao","cliente");
    iniciarSistema();
  }
  else{
    alert("Login inválido!");
  }
}

function iniciarSistema(){
  document.getElementById("telaLogin").style.display="none";
  
  if(usuarioLogado !== "admin"){
    document.querySelector("h2").style.display="none";
    document.querySelector("main div").style.display="none";
  }

  carregarProdutos();
  atualizarCarrinhoLateral();
}

window.onload = function(){
  const sessao = localStorage.getItem("mitiSessao");
  if(sessao){
    usuarioLogado = sessao;
    iniciarSistema();
  }
}

/* ================= PRODUTOS ================= */

function adicionarProduto() {
  if(usuarioLogado !== "admin"){ alert("Acesso restrito!"); return; }

  const nome = document.getElementById("nomeProduto").value;
  const preco = document.getElementById("precoProduto").value;
  const estoque = document.getElementById("estoqueProduto").value;
  const arquivo = document.getElementById("imagemProduto").files[0];

  if (!nome || !preco || !estoque || !arquivo) { alert("Preencha todos os campos!"); return; }

  const reader = new FileReader();
  reader.onload = function(e) {
    const novoProduto = {
      id: Date.now(),
      nome,
      preco: parseFloat(preco),
      estoque: parseInt(estoque),
      imagem: e.target.result
    };
    produtos.push(novoProduto);
    salvarTudo();
    carregarProdutos();
  };
  reader.readAsDataURL(arquivo);
}

function removerProduto(id) {
  if(usuarioLogado !== "admin"){ alert("Apenas administrador!"); return; }
  produtos = produtos.filter(p => p.id !== id);
  salvarTudo();
  carregarProdutos();
}

function carregarProdutos() {
  const container = document.getElementById("produtos");
  container.innerHTML = "";
  produtos.forEach(produto => {
    const card = document.createElement("div");
    card.className = "produto";

    let botaoRemover = "";
    if(usuarioLogado === "admin"){
      botaoRemover = `<button onclick="removerProduto(${produto.id})" style="background:red;margin-top:5px;">Remover</button>`;
    }

    card.innerHTML = `
      <img src="${produto.imagem}">
      <h3>${produto.nome}</h3>
      <p>R$ ${produto.preco.toFixed(2)}</p>
      <p>Estoque: ${produto.estoque}</p>
      <button onclick="adicionarAoCarrinho(${produto.id})" ${produto.estoque<=0?'disabled':''}>
        ${produto.estoque<=0?'Esgotado':'Adicionar ao Carrinho'}
      </button>
      ${botaoRemover}
    `;
    container.appendChild(card);
  });
}

/* ================= CARRINHO ================= */

function adicionarAoCarrinho(id) {
  const produto = produtos.find(p=>p.id===id);
  if(!produto||produto.estoque<=0) return;

  const item = carrinho.find(p=>p.id===id);
  if(item){ item.quantidade++; } 
  else { carrinho.push({...produto, quantidade:1}); }

  produto.estoque--;
  salvarTudo();
  carregarProdutos();
  atualizarCarrinhoLateral();
}

function removerDoCarrinho(id){
  const item = carrinho.find(p=>p.id===id);
  const produto = produtos.find(p=>p.id===id);
  if(!item||!produto) return;

  produto.estoque += item.quantidade;
  carrinho = carrinho.filter(p=>p.id!==id);
  salvarTudo();
  carregarProdutos();
  atualizarCarrinhoLateral();
}

function atualizarCarrinhoLateral(){
  const container = document.getElementById("itensCarrinhoLateral");
  const totalEl = document.getElementById("totalCarrinhoLateral");
  container.innerHTML="";
  let total =0;

  carrinho.forEach(item=>{
    total += item.preco*item.quantidade;
    container.innerHTML += `
      <div>
        ${item.nome} x${item.quantidade} - R$ ${(item.preco*item.quantidade).toFixed(2)}
        <button onclick="removerDoCarrinho(${item.id})">❌</button>
      </div>`;
  });

  totalEl.innerText=total.toFixed(2);
}

function finalizarCompra(){
  if(carrinho.length===0){ alert("Carrinho vazio!"); return; }
  carrinho = [];
  salvarTudo();
  atualizarCarrinhoLateral();
  alert("Compra finalizada!");
}

/* ================= PROTEÇÃO BÁSICA ================= */

// bloquear botão direito
document.addEventListener("contextmenu", e => e.preventDefault());

// bloquear F12 / DevTools
document.onkeydown = function(e){
  if(e.key === "F12") return false;
  if(e.ctrlKey && e.shiftKey && e.key === "I") return false;
  if(e.ctrlKey && e.key === "U") return false;
};

// bloquear console
setInterval(()=>{
  const before = new Date().getTime();
  debugger;
  const after = new Date().getTime();
  if(after - before > 100){
    document.body.innerHTML = "Acesso bloqueado!";
  }
},1000);

</script>

</body>
<div id="telaLogin" style="position:fixed;inset:0;background:#fff;display:flex;justify-content:center;align-items:center;z-index:5000;">
  <div style="background:#fff;padding:30px;border-radius:10px;box-shadow:0 0 15px rgba(0,0,0,0.2);width:300px;">
    <h2>Login mitiCosturas</h2>
    <input type="text" id="loginUsuario" placeholder="Usuário">
    <input type="password" id="loginSenha" placeholder="Senha">
    <button onclick="fazerLogin()">Entrar</button>
</div>
</html>

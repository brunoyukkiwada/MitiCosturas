<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Admin - mitiCosturas</title>

<style>

body{
font-family:Arial;
background:#f4f4f4;
padding:20px
}

h1{
text-align:center
}

.box{
background:white;
padding:20px;
border-radius:10px;
margin-bottom:20px;
box-shadow:0 2px 5px rgba(0,0,0,.1)
}

input{
width:100%;
padding:10px;
margin-bottom:10px;
border-radius:5px;
border:1px solid #ccc
}

button{
padding:10px;
border:none;
background:#ff6b6b;
color:white;
border-radius:5px;
cursor:pointer
}

button:hover{
background:#ff4c4c
}

.produto{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px;
border-bottom:1px solid #ddd;
padding-bottom:10px
}

img{
width:60px;
height:60px;
object-fit:cover;
border-radius:5px
}

</style>
</head>

<body>

<h1>Painel Admin 🧵</h1>

<div class="box">

<h2>Adicionar Produto</h2>

<input id="nome" placeholder="Nome do produto">

<input id="preco" type="number" placeholder="Preço">

<input id="estoque" type="number" placeholder="Estoque">

<input id="imagem" placeholder="URL da imagem">

<button onclick="adicionarProduto()">Adicionar Produto</button>

</div>

<div class="box">

<h2>Produtos da Loja</h2>

<div id="listaProdutos"></div>

</div>

<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>

/* FIREBASE */

const firebaseConfig = {

apiKey:"SUA_KEY",
authDomain:"SEU_DOMINIO",
projectId:"SEU_ID"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

/* DADOS */

let produtos = [];

/* ADICIONAR PRODUTO */

async function adicionarProduto(){

const nome = document.getElementById("nome").value;
const preco = Number(document.getElementById("preco").value);
const estoque = Number(document.getElementById("estoque").value);
const imagem = document.getElementById("imagem").value;

if(!nome || !preco || !estoque){

alert("Preencha os campos");

return;

}

const produto = {

id: Date.now(),
nome,
preco,
estoque,
imagem

};

produtos.push(produto);

await salvarProdutos();

limparCampos();

}

/* SALVAR */

async function salvarProdutos(){

await db.collection("loja")
.doc("produtos")
.set({

lista: produtos

});

}

/* REMOVER */

async function removerProduto(id){

produtos = produtos.filter(p => p.id !== id);

await salvarProdutos();

}

/* RENDER */

function renderizarProdutos(){

const container = document.getElementById("listaProdutos");

container.innerHTML="";

produtos.forEach(p=>{

container.innerHTML += `

<div class="produto">

<div style="display:flex;gap:10px;align-items:center">

<img src="${p.imagem}">

<div>

${p.nome}<br>

R$ ${p.preco}<br>

Estoque: ${p.estoque}

</div>

</div>

<button onclick="removerProduto(${p.id})">

Remover

</button>

</div>

`;

});

}

/* TEMPO REAL */

db.collection("loja")
.doc("produtos")
.onSnapshot((doc)=>{

if(doc.exists){

produtos = doc.data().lista || [];

renderizarProdutos();

}

});

/* LIMPAR */

function limparCampos(){

document.getElementById("nome").value="";
document.getElementById("preco").value="";
document.getElementById("estoque").value="";
document.getElementById("imagem").value="";

}

</script>

</body>
</html>

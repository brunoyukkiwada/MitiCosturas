<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mitiCosturas - Admin Mobile</title>
<style>
body{margin:0;padding:0;font-family:Arial,sans-serif;background:#f9f9f9}
header{background:#ff6b6b;color:#fff;padding:20px;text-align:center;font-size:22px;font-weight:bold}
.container{padding:15px}
input,button{width:100%;padding:15px;margin:5px 0;border-radius:10px;border:1px solid #ccc;font-size:16px}
button{border:none;background:#ff6b6b;color:#fff;cursor:pointer;font-weight:bold}
button:hover{background:#ff4c4c}
.produto{background:#fff;margin:10px 0;padding:10px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;box-shadow:0 2px 5px rgba(0,0,0,.1)}
.produto img{width:60px;height:60px;border-radius:5px;object-fit:cover;margin-right:10px}
.produto-info{flex:1;display:flex;align-items:center;flex-wrap:wrap}
@media(max-width:400px){.produto-info{flex-direction:column;align-items:flex-start}.produto button{width:48%;margin-top:5px}}
</style>
</head>
<body>

<header>mitiCosturas - Admin</header>
<div class="container">
<h2>Adicionar Produto</h2>
<input type="text" id="nomeProduto" placeholder="Nome do produto">
<input type="number" id="precoProduto" placeholder="Preço (R$)">
<input type="number" id="estoqueProduto" placeholder="Quantidade em estoque">
<input type="file" id="imagemProduto" accept="image/*">
<button onclick="adicionarProduto()">Adicionar Produto</button>

<h2>Produtos Existentes</h2>
<div id="listaProdutos"></div>
</div>

<script>
let produtos=JSON.parse(localStorage.getItem("mitiProdutos"))||[];

function salvarProdutos(){ localStorage.setItem("mitiProdutos",JSON.stringify(produtos)); carregarProdutos(); }

function carregarProdutos(){
  const lista=document.getElementById("listaProdutos");
  lista.innerHTML="";
  produtos.forEach((p,i)=>{
    if(!p.id)p.id=Date.now()+i;
    const div=document.createElement("div");
    div.className="produto";
    div.innerHTML=`
      <div class="produto-info">
        <img src="${p.imagem}">
        <span>${p.nome} - R$ ${p.preco.toFixed(2)} - Estoque: ${p.estoque}</span>
      </div>
      <div>
        <button onclick="editarProduto(${i})">Editar</button>
        <button onclick="removerProduto(${i})" style="background:red">Remover</button>
      </div>`;
    lista.appendChild(div);
  });
}

function adicionarProduto(){
  const nome=document.getElementById("nomeProduto").value;
  const preco=parseFloat(document.getElementById("precoProduto").value);
  const estoque=parseInt(document.getElementById("estoqueProduto").value);
  const arquivo=document.getElementById("imagemProduto").files[0];
  if(!nome||!preco||!estoque||!arquivo){ alert("Preencha todos os campos!"); return; }
  const reader=new FileReader();
  reader.onload=function(e){ produtos.push({id:Date.now(),nome,preco,estoque,imagem:e.target.result}); salvarProdutos(); limparCampos(); }
  reader.readAsDataURL(arquivo);
}

function editarProduto(i){
  const p=produtos[i];
  const novoNome=prompt("Nome:",p.nome);
  const novoPreco=parseFloat(prompt("Preço:",p.preco));
  const novoEstoque=parseInt(prompt("Estoque:",p.estoque));
  if(novoNome&&!isNaN(novoPreco)&&!isNaN(novoEstoque)){ p.nome=novoNome; p.preco=novoPreco; p.estoque=novoEstoque; salvarProdutos(); }
}

function removerProduto(i){ if(confirm("Remover produto?")){ produtos.splice(i,1); salvarProdutos(); } }

function limparCampos(){ document.getElementById("nomeProduto").value=""; document.getElementById("precoProduto").value=""; document.getElementById("estoqueProduto").value=""; document.getElementById("imagemProduto").value=""; }

window.onload=function(){ carregarProdutos(); }
</script>

</body>
</html>
